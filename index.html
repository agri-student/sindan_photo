<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農作物 生育診断</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background: #f0f4e8;
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }

        header {
            text-align: center;
            padding: 24px 0;
        }

        header h1 {
            font-size: 1.6rem;
            color: #2d6a2e;
        }

        .subtitle {
            color: #666;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        /* API Key */
        .api-key-area {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .api-key-area label {
            display: block;
            font-weight: 600;
            color: #2d6a2e;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .api-key-area select,
        .api-key-area input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            background: #fff;
        }

        .api-key-area select {
            margin-bottom: 10px;
            cursor: pointer;
        }

        .api-key-area select:focus,
        .api-key-area input:focus {
            outline: none;
            border-color: #2d6a2e;
        }

        .api-key-area .hint {
            font-size: 0.75rem;
            color: #999;
            margin-top: 6px;
        }

        .api-key-area .saved-badge {
            display: inline-block;
            background: #e8f5e8;
            color: #2d6a2e;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
        }

        /* Upload */
        .upload-area {
            border: 3px dashed #a0c4a0;
            border-radius: 16px;
            padding: 48px 24px;
            text-align: center;
            background: #fff;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .upload-area:hover,
        .upload-area.dragover {
            border-color: #2d6a2e;
            background: #f8fdf5;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .upload-area p {
            color: #666;
            line-height: 1.6;
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .preview-area {
            text-align: center;
            margin-bottom: 16px;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            margin-top: 16px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #2d6a2e;
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: #245523;
        }

        .btn-secondary {
            background: #e8e8e8;
            color: #333;
        }

        .btn-secondary:hover {
            background: #ddd;
        }

        .loading {
            text-align: center;
            padding: 32px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e8e8e8;
            border-top-color: #2d6a2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            color: #666;
        }

        .result-area {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .result-area h2 {
            color: #2d6a2e;
            font-size: 1.2rem;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e8f5e8;
        }

        .result-content {
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .result-content strong {
            color: #2d6a2e;
        }

        .error-msg {
            background: #fff0f0;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>農作物 生育診断</h1>
            <p class="subtitle">スマホで撮った写真をAIが分析します</p>
        </header>

        <main>
            <div class="api-key-area">
                <label>AIサービス選択</label>
                <select id="providerSelect">
                    <option value="anthropic">Claude (Anthropic)</option>
                    <option value="openai">ChatGPT (OpenAI)</option>
                    <option value="google">Gemini (Google)</option>
                </select>
                <label>
                    API Key
                    <span class="saved-badge" id="savedBadge" style="display:none">保存済み</span>
                </label>
                <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-...">
                <p class="hint">キーはブラウザにのみ保存され、外部には送信されません</p>
            </div>

            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📷</div>
                <p>写真をタップして選択<br>またはドラッグ&ドロップ</p>
                <input type="file" id="fileInput" accept="image/*" capture="environment">
            </div>

            <div class="preview-area" id="previewArea" style="display: none;">
                <img id="previewImage" alt="プレビュー">
                <button class="btn btn-secondary" id="resetBtn">写真を変更</button>
            </div>

            <button class="btn btn-primary" id="analyzeBtn" disabled>診断する</button>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>AIが分析中です...</p>
            </div>

            <div class="result-area" id="resultArea" style="display: none;">
                <h2>診断結果</h2>
                <div class="result-content" id="resultContent"></div>
            </div>
        </main>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const providerSelect = document.getElementById("providerSelect");
        const apiKeyInput = document.getElementById("apiKeyInput");
        const savedBadge = document.getElementById("savedBadge");
        const uploadArea = document.getElementById("uploadArea");
        const fileInput = document.getElementById("fileInput");
        const previewArea = document.getElementById("previewArea");
        const previewImage = document.getElementById("previewImage");
        const resetBtn = document.getElementById("resetBtn");
        const analyzeBtn = document.getElementById("analyzeBtn");
        const loading = document.getElementById("loading");
        const resultArea = document.getElementById("resultArea");
        const resultContent = document.getElementById("resultContent");

        let selectedFile = null;

        const providerConfig = {
            anthropic: { placeholder: "sk-ant-api03-...", storageKey: "anthropic_api_key" },
            openai:    { placeholder: "sk-...",           storageKey: "openai_api_key" },
            google:    { placeholder: "AIzaSy...",        storageKey: "google_api_key" },
        };

        // プロバイダー切り替え時にAPIキーを復元
        function switchProvider() {
            const provider = providerSelect.value;
            const config = providerConfig[provider];
            apiKeyInput.placeholder = config.placeholder;
            const savedKey = localStorage.getItem(config.storageKey);
            apiKeyInput.value = savedKey || "";
            savedBadge.style.display = savedKey ? "inline-block" : "none";
        }

        // 初期化: 保存されたプロバイダーを復元
        const savedProvider = localStorage.getItem("selected_provider") || "anthropic";
        providerSelect.value = savedProvider;
        switchProvider();

        providerSelect.addEventListener("change", () => {
            localStorage.setItem("selected_provider", providerSelect.value);
            switchProvider();
        });

        apiKeyInput.addEventListener("input", () => {
            const key = apiKeyInput.value.trim();
            const storageKey = providerConfig[providerSelect.value].storageKey;
            if (key) {
                localStorage.setItem(storageKey, key);
                savedBadge.style.display = "inline-block";
            } else {
                localStorage.removeItem(storageKey);
                savedBadge.style.display = "none";
            }
        });

        function showPreview(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                uploadArea.style.display = "none";
                previewArea.style.display = "block";
                analyzeBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        function reset() {
            selectedFile = null;
            fileInput.value = "";
            previewImage.src = "";
            uploadArea.style.display = "block";
            previewArea.style.display = "none";
            analyzeBtn.disabled = true;
            resultArea.style.display = "none";
        }

        fileInput.addEventListener("change", (e) => {
            if (e.target.files.length > 0) showPreview(e.target.files[0]);
        });

        uploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            uploadArea.classList.add("dragover");
        });

        uploadArea.addEventListener("dragleave", () => {
            uploadArea.classList.remove("dragover");
        });

        uploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            uploadArea.classList.remove("dragover");
            if (e.dataTransfer.files.length > 0) showPreview(e.dataTransfer.files[0]);
        });

        resetBtn.addEventListener("click", reset);

        const systemPrompt = `あなたは農業の専門家です。ユーザーがアップロードした農作物の写真を分析し、以下の観点から生育状態を診断してください。

## 診断項目
1. **作物の種類**: 写真に写っている農作物を特定
2. **生育ステージ**: 現在の成長段階（発芽期・生長期・開花期・結実期・収穫期など）
3. **健康状態**: 総合的な健康度を5段階で評価（★1〜★5）
4. **葉の状態**: 色・形・大きさの異常の有無
5. **病害虫の兆候**: 病気や害虫被害の兆候の有無と、あれば具体的な病名・害虫名
6. **栄養状態**: 栄養過多・不足の兆候（窒素・リン・カリウムなど）
7. **アドバイス**: 今後の管理で注意すべき点や推奨される対策

## 回答形式
わかりやすい日本語で、農業初心者にも理解できるように回答してください。
写真が農作物でない場合は、その旨を伝えてください。`;

        const userText = "この農作物の写真を分析して、生育状態を診断してください。";

        // --- プロバイダー別 API呼び出し ---

        async function callAnthropic(apiKey, base64Image, mediaType) {
            const response = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-api-key": apiKey,
                    "anthropic-version": "2023-06-01",
                    "anthropic-dangerous-direct-browser-access": "true",
                },
                body: JSON.stringify({
                    model: "claude-sonnet-4-20250514",
                    max_tokens: 2048,
                    system: systemPrompt,
                    messages: [{
                        role: "user",
                        content: [
                            { type: "image", source: { type: "base64", media_type: mediaType, data: base64Image } },
                            { type: "text", text: userText },
                        ],
                    }],
                }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "Anthropic APIエラー");
            return data.content[0].text;
        }

        async function callOpenAI(apiKey, base64Image, mediaType) {
            const response = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`,
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    max_tokens: 2048,
                    messages: [
                        { role: "system", content: systemPrompt },
                        {
                            role: "user",
                            content: [
                                { type: "image_url", image_url: { url: `data:${mediaType};base64,${base64Image}` } },
                                { type: "text", text: userText },
                            ],
                        },
                    ],
                }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "OpenAI APIエラー");
            return data.choices[0].message.content;
        }

        async function callGoogle(apiKey, base64Image, mediaType) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    system_instruction: { parts: [{ text: systemPrompt }] },
                    contents: [{
                        parts: [
                            { inline_data: { mime_type: mediaType, data: base64Image } },
                            { text: userText },
                        ],
                    }],
                    generationConfig: { maxOutputTokens: 2048 },
                }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "Google APIエラー");
            return data.candidates[0].content.parts[0].text;
        }

        const providerCallMap = { anthropic: callAnthropic, openai: callOpenAI, google: callGoogle };

        analyzeBtn.addEventListener("click", async () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) { showError("API Keyを入力してください"); return; }
            if (!selectedFile) return;

            analyzeBtn.disabled = true;
            loading.style.display = "block";
            resultArea.style.display = "none";

            try {
                const base64Image = await fileToBase64(selectedFile);
                const ext = selectedFile.name.split(".").pop().toLowerCase();
                const mediaTypeMap = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp" };
                const mediaType = mediaTypeMap[ext] || "image/jpeg";

                const callFn = providerCallMap[providerSelect.value];
                const resultText = await callFn(apiKey, base64Image, mediaType);
                resultContent.innerHTML = formatResult(resultText);
                resultArea.style.display = "block";
            } catch (err) {
                showError(err.message || "通信エラーが発生しました。ネットワーク接続を確認してください。");
            } finally {
                loading.style.display = "none";
                analyzeBtn.disabled = false;
            }
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(",")[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function showError(msg) {
            resultContent.innerHTML = `<div class="error-msg">${escapeHtml(msg)}</div>`;
            resultArea.style.display = "block";
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function formatResult(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
                .replace(/^### (.+)$/gm, "<h3>$1</h3>")
                .replace(/^## (.+)$/gm, "<h2>$1</h2>")
                .replace(/\n/g, "<br>");
        }
    });
    </script>
</body>
</html>
